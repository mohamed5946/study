name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project and fetch packages
        run: bash setup.sh

      - name: Build release APK
        run: flutter build apk --release
        # Demo mode: no AI server is connected, so the app returns
        # canned demo answers. To connect a real AI server add:
        #   --dart-define=AI_BASE_URL=https://your-server.com

      - uses: actions/upload-artifact@v4
        with:
          name: study-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Latest successful build of Study (demo mode, no AI server connected)."
          files: build/app/outputs/flutter-apk/app-release.apk
